[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mtp-align"
version = "0.1.0"
description = "Experiment with a window-based tool-call flush scheduler and an OpenAI-compatible streaming proxy."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "deepseek",
    "mtp",
    "multi-token-prediction",
    "llama-cpp",
    "agent",
    "inference",
    "scheduler",
    "local-llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/mtp-align"
Repository = "https://github.com/SuperMarioYL/mtp-align"
Issues = "https://github.com/SuperMarioYL/mtp-align/issues"

[project.scripts]
mtp-align = "mtp_align.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mtp_align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
